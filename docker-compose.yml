services:
  db:
    image: postgis/postgis:16-3.4
    container_name: urban-inspection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
      POSTGRES_DB: urban_inspection
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The image's init script runs CREATE EXTENSION postgis on first start;
      # replacing it with an empty script keeps the extension disabled for now.
      - ./docker/db/disable-postgis-init.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
