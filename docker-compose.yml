services:
  db:
    image: postgis/postgis:16-3.4
    container_name: urban-inspection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
      POSTGRES_DB: urban_inspection
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
